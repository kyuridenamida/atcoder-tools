name: Run unit tests & integration tests

on:
  push:
    branches: [ stable ]
  pull_request:
    branches: [ stable ]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ATCODERTOOLS_TEST_COMPILERS: 1
      # Only one job talks to atcoder.jp so that the jobs don't make each other rate-limited.
      ATCODERTOOLS_TEST_NETWORK: ${{ matrix.python-version == '3.13' && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 - --version 2.4.1

      - name: Add path for Poetry
        run: echo "$HOME/.poetry/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: poetry install --no-interaction

      # Install Compilers for integration tests
      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-latest

      - name: Install Jilia
        uses: julia-actions/setup-julia@v3
        with:
          version: 1.11.6

      - name: Install nim
        uses: iffy/install-nim@v5
        with:
          version: 1.6.14

      - name: Install other compilers
        run: |
          sudo apt-get update
          sudo apt-get install mono-complete binfmt-support
          # The default test command for C# executes the binary built by mcs directly.
          sudo update-binfmts --install cli /usr/bin/mono --magic MZ

      - name: Run against atcoder.jp
        if: env.ATCODERTOOLS_TEST_NETWORK == '1'
        run: poetry run atcoder-tools gen arc050 --without-login

      - name: Run Unit Tests and Integration Tests
        run: |
          poetry run nosetests tests --exe -v --with-coverage --cover-package=atcodertools
          poetry run codecov
