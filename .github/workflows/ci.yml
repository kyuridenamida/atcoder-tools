name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ".[dev]"
      - run: mypy

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.9 is EOL and no longer shipped for ubuntu-26.04/macos-15+ runner
        # images; it is tested separately on ubuntu-22.04 (see include below).
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[dev]"
      # Whatever language toolchains the runner has get used automatically;
      # tests needing missing toolchains (nim/dmd/mono) or network skip.
      - run: python -m pytest tests -q
