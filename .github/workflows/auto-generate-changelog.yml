# Create Release already updates the change log. Use this to regenerate it, e.g. after editing a milestone.
name: Update Changelog
on:
  workflow_dispatch:
    inputs:
      releaseversion:
        description: 'Specify release version (e.g. 2.0.1)'
        required: true
        default: ''
permissions:
  contents: write
jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate CHANGELOG.md
        run: python3 dev-tools/create_changelog.py "$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.releaseversion }}

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -am "Commit from GitHub Actions (Update Changelog)"
          git push
