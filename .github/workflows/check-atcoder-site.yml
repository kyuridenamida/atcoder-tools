name: Check against atcoder.jp

# AtCoder changes its pages without notice. Notice it here rather than from user reports.
on:
  schedule:
    - cron: '0 21 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: Install
        run: pip install .
      - name: Run against atcoder.jp
        env:
          ATCODERTOOLS_TEST_NETWORK: 1
        run: |
          python -m unittest -v tests.test_atcoder_client_real
          atcoder-tools gen abc400 --without-login --workspace "$RUNNER_TEMP/workspace"
          ls "$RUNNER_TEMP"/workspace/abc400/*/main.cpp
      - name: Report failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: Scheduled check against atcoder.jp failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "atcoder.jp may have changed. See $RUN_URL"
          fi
