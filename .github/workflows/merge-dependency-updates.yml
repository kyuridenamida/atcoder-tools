name: Merge dependency updates

# Runs once the tests of a Dependabot pull request have finished.
on:
  workflow_run:
    workflows: ["Run unit tests & integration tests"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # webapp/ is not covered by any check, so its updates are left for a human.
      - name: Merge if every check passed
        run: |
          test "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json author,files \
              --jq '.author.login == "app/dependabot" and all(.files[].path; startswith("webapp/") | not)')" = true
          gh pr checks "$PR" --repo "$GITHUB_REPOSITORY"
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD_SHA"
