[codestyle]
indent_type = 'space' # 'tab' or 'space'
indent_width = 4

workspace_dir = '~/atcoder-workspace/'
lang = 'cpp' # cpp, java, rust, python, nim, d, or cs

## template_file is a file path to template code
#template_file=

## code_generator_file is a path to .py file defining custom code generator function.
## Please check README.md for details.
#code_generator_file=


[cpp.postprocess]
## exec_on_each_problem_dir is executed after every problem directory's creation
## with its problem directory as cwd like arc001/A
#exec_on_each_problem_dir='clang-format -i ./*.cpp'

## exec_on_contest_dir is executed once after `atcoder-tools gen`
## with the contest directory as cwd like arc001/
#exec_on_contest_dir=

[cpp.run]
## Reserved for future use: these keys are parsed but currently ignored.
## The actual compile/run commands come from the language definitions.
## compile_command is intended to be used by `atcoder-tools compile`.
# compile_command="g++ main.cpp"

## run_command is intended to be used by `atcoder-tools test`.
# run_command="./main"

[etc]
download_without_login=false
parallel_download=false
save_no_session_cache=false
in_example_format="in_{}.txt"
out_example_format="out_{}.txt"
compile_before_testing=false
compile_only_when_diff_detected=false