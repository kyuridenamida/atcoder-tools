<!DOCTYPE html>
<html>
<!-- minimal fixture reproducing the current atcoder.jp submit page structure:
     the client extracts csrf_token (first hidden input), the task selector
     (select#select-task) and the language selector (select[data-placeholder="-"]). -->
<body>
<form method="POST" action="/contests/arc001/submit">
    <input type="hidden" name="csrf_token" value="dummy_csrf_token">
    <select name="data.TaskScreenName" id="select-task">
        <option value="arc001_1" selected>A - センター採点</option>
        <option value="arc001_2">B - リモコン</option>
        <option value="arc001_3">C - パズルのお手伝い</option>
        <option value="arc001_4">D - レースゲーム</option>
    </select>
    <select name="data.LanguageId" data-placeholder="-">
        <option value="4001">C (GCC 9.3.0)</option>
        <option value="4003" selected>C++ (GCC 9.3.0)</option>
        <option value="3024">C++14 (GCC 5.4.1)</option>
        <option value="4101">Python3 (3.11.4)</option>
    </select>
    <textarea name="sourceCode"></textarea>
</form>
</body>
</html>
